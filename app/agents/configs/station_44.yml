                  "emotional_note": "Hesitant, fearful"
                }}
              ],
              "character_notes": "Voice type, accent, emotional arc notes",
              "sides_script": "CHARACTER-SPECIFIC SCRIPT WITH CUES"
            }}
          ]
        }},
        "package_manifest": [
          "Master Scripts (all episodes)",
          "Table Read Scripts (all episodes)",
          "Production Scripts (all episodes)",
          "Recording Scripts (per character)",
          "Change Log",
          "Format Guide"
        ]
      }}
    }}
