            "Character relationship maps",
            "Episode synopsis",
            "Scene breakdown"
          ]
        }},
        "production_scripts": {{
          "purpose": "Full technical production",
          "technical_detail_level": "COMPLETE",
          "episodes": [
            {{
              "episode_number": 1,
              "sound_cue_sheet": {{
                "sfx_cues": [
                  {{
                    "cue_number": "SFX-001",
                    "location": "Scene 1, Line 5",
                    "description": "Door opens",
                    "priority": "CRITICAL|HIGH|MEDIUM|LOW",
                    "duration": "2 seconds",
                    "volume": "FOREGROUND|BACKGROUND"
                  }}
