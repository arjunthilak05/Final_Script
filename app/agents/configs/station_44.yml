                  }}
                ]
              }},
              "timing_breakdown": {{
                "act_1": "0:00 - 12:00 (12 minutes)",
                "act_2": "12:00 - 32:00 (20 minutes)",
                "act_3": "32:00 - 45:00 (13 minutes)"
              }},
              "technical_requirements": [
                "Reverb processing for warehouse scenes",
                "Phone filter for dialogue",
                "Layered crowd effects"
              ],
              "annotated_script": "PRODUCTION SCRIPT WITH FULL TECHNICAL NOTES"
            }}
          ]
        }},
        "recording_scripts": {{
          "purpose": "Actor-specific recording sessions",
          "organization": "BY_CHARACTER",
          "actor_sides": [
            {{
              "character_name": "CHARACTER_NAME",
              "total_lines": 150,
              "episodes_appearing": [1, 2, 3, 5, 8],
              "recording_order": [
                {{
                  "scene_number": "1-A",
                  "episode": 1,
                  "context": "Opening scene - character is nervous",
                  "cue_line": "Previous character's line",
