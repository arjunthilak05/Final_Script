# Station 44: Package Assembly Configuration

model: "glm-4.5"
temperature: 0.2
max_tokens: 16000

prompts:
  master_script_package: |
    You are the Package Assembler preparing final delivery for audio series production.

    This is the FINAL ASSEMBLY. Every script version must be packaged correctly for different teams.

    SESSION CONTEXT:
    Session ID: {session_id}
    Total Episodes: {total_episodes}

    POLISHED SCRIPTS (All Episodes):
    {polished_scripts}

    PROJECT DNA:
    {project_dna}

    STYLE GUIDE:
    {style_guide}

    CHARACTER BIBLE:
    {character_bible}

    TASK 1: MASTER SCRIPT PACKAGE - ASSEMBLE FINAL SCRIPTS

    Create multiple script versions for different purposes:

    1. **MASTER SCRIPTS**:
       - All episodes complete and in order
       - Formatted consistently per industry standards
       - Version numbered (v1.0 FINAL)
       - Change log included (what changed from draft to final)
       - Each episode clearly labeled with episode number and title
       - Runtime estimates per episode

    2. **TABLE READ SCRIPTS**:
       - Simplified format for actors' first read
       - Performance notes included but minimal
       - Character sheets attached (who's in this episode)
       - Pronunciation guide for names/places
       - Less technical detail, more readability

    3. **PRODUCTION SCRIPTS**:
       - Full technical annotation from Station 43
       - Sound cue sheets embedded
       - Music spotting notes included
       - SFX priority markers clear
       - Technical requirements per scene
       - Timing breakdowns per act

    4. **RECORDING SCRIPTS**:
       - Actor sides prepared (character-specific)
       - Only their lines + cue lines
       - Recording schedule order
       - Scene numbers for continuity
       - Character emotional state notes

    Return ONLY valid JSON:

    ```json
    {{
      "master_script_package": {{
        "overall_completion": 0.0-1.0,
        "master_scripts": {{
          "format_standard": "AUDIO_DRAMA|SCREENPLAY|HYBRID",
          "version": "v1.0 FINAL",
          "total_episodes": 0,
          "total_runtime_minutes": 0,
          "episodes": [
            {{
              "episode_number": 1,
              "episode_title": "Episode Title",
              "runtime_estimate": "45 minutes",
              "word_count": 7500,
              "scene_count": 12,
              "character_count": 8,
              "script_text": "FORMATTED MASTER SCRIPT TEXT"
            }}
          ],
          "change_log": [
            {{
              "episode": 1,
              "change_type": "dialogue|structure|audio_cue|character",
              "description": "what changed from draft",
              "reason": "why change was made"
            }}
          ],
          "formatting_notes": "Industry standard audio drama format. Character names CAPS, SFX marked [SFX:], Music marked [MUSIC:]"
        }},
        "table_read_scripts": {{
          "purpose": "First read-through with cast",
          "simplifications": [
            "Minimal technical notes",
            "Enhanced readability",
            "Pronunciation guides included",
            "Character context provided"
          ],
          "episodes": [
            {{
              "episode_number": 1,
              "characters_in_episode": ["Character names"],
