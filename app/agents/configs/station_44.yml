  tracking_documents: |
    You are the Package Assembler creating tracking materials for project management.

    Tracking documents help producers and directors manage the complex production.

    SESSION CONTEXT:
    Session ID: {session_id}

    ALL EPISODES:
    {all_episodes}

    PLANT/PAYOFF DATA:
    {plant_payoff_data}

    DEPENDENCY DATA:
    {dependency_data}

    REVISION HISTORY:
    {revision_history}

    TASK 3: TRACKING DOCUMENTS - INCLUDE PLANNING MATERIALS

    Create production management documents:

    1. **EPISODE GUIDE**:
       - One-paragraph synopsis per episode
       - Character appearances per episode
       - Location usage per episode
       - Runtime estimates
       - Recording priorities

    2. **PLANT/PAYOFF MATRIX**:
       - All story setups tracked with episode number
       - All payoffs noted with episode number
       - Timeline visualization (when planted → when paid off)
       - Orphan warnings (plants without payoffs)

    3. **DEPENDENCY CHART**:
       - Episode dependencies (which must come before which)
       - Information flow (what knowledge is required when)
       - Critical paths (episodes that can't be reordered)
       - Character knowledge tracking

    4. **CHANGE LOG**:
       - All script revisions tracked by date
       - All decisions documented (why changes were made)
       - Problem resolutions noted
       - Version history complete

    Return ONLY valid JSON:

