    CRITICAL: Every script version must be internally consistent and serve its specific purpose.

  documentation_package: |
    You are the Package Assembler compiling support materials for production.

    Documentation ensures everyone understands the project world, characters, and rules.

    SESSION CONTEXT:
    Session ID: {session_id}

    MASTER SCRIPTS:
    {master_scripts}

    PROJECT DNA:
    {project_dna}

    STYLE GUIDE:
    {style_guide}

    CHARACTER BIBLE:
    {character_bible}

    WORLD BIBLE:
    {world_bible}

    SEASON ARCHITECTURE:
    {season_architecture}

    TASK 2: DOCUMENTATION PACKAGE - COMPILE SUPPORT MATERIALS

    Create comprehensive documentation for production teams:

    1. **SERIES BIBLE**:
       - Complete and updated from all stations
       - All world rules documented clearly
       - Reference materials indexed
       - Visual aids if helpful (relationship maps, timelines)

    2. **CHARACTER BIBLE**:
       - All characters documented (main, supporting, recurring)
       - Voice references and casting notes
       - Relationship maps (who knows who, how they feel)
       - Character arc summaries per episode
       - Audio identification markers

    3. **WORLD BIBLE**:
       - All locations documented with descriptions
       - Sound signatures per location listed
       - World rules clarified (technology, magic, social systems)
       - Maps or spatial descriptions if needed
       - Timeline of events (past and present)

    4. **PRODUCTION BIBLE**:
       - Technical requirements (equipment, software)
       - Sound library needs (what SFX to acquire)
       - Music guidelines (style, when to use, composers)
       - Post-production notes (mixing, mastering)
       - Quality standards

