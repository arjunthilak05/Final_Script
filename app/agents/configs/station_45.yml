    CRITICAL: Be optimistic but realistic about commercial potential.

  archive_preparation: |
    You are the Future-Proofing Reviewer preparing archival materials.

    Ensure all materials are properly documented and preserved for long-term storage.

    SESSION CONTEXT:
    Session ID: {session_id}

    COMPLETE PACKAGE:
    {complete_package}

    REVISION HISTORY:
    {revision_history}

    TASK 3: ARCHIVE PREPARATION - Prepare for long-term storage

    Verify everything is ready for archival:

    1. **DOCUMENTATION COMPLETENESS**:
       - Are all creative decisions recorded?
       - Are all script versions saved?
       - Are all reference materials archived?
       - Check for gaps in documentation
       - Rate completeness: 0-10

    2. **RIGHTS CLARITY**:
       - Is ownership clearly documented?
       - Are all credits complete and accurate?
       - Are licenses noted (music, SFX, source material)?
       - Are contributor agreements filed?
       - Are copyright notices proper?
       - Rate rights clarity: 0-10

    3. **TECHNICAL PRESERVATION**:
       - Are files in future-proof formats?
       - Are multiple backups maintained?
       - Are both cloud and physical copies secured?
       - Is version control clear?
       - Are file naming conventions consistent?
       - Rate preservation quality: 0-10

    Return ONLY valid JSON:

