            "feasible": true/false,
            "format": "NOVEL|NOVELLA|GRAPHIC_NOVEL|SHORT_STORIES",
            "strengths": ["Why it would work as prose"],
            "challenges": ["What makes prose difficult"],
            "target_audience": "Who would read this?"
          }},
          "other_formats": [
            {{
              "format": "PODCAST|AUDIOBOOK|VIDEO_GAME|VR_EXPERIENCE|COMIC",
              "feasibility": "HIGH|MEDIUM|LOW",
              "notes": "Why this format works or doesn't"
            }}
          ],
          "best_adaptation_path": "Which format to pursue first",
          "adaptation_barriers": [
            "What limits format flexibility"
          ]
        }},
        "recommended_next_steps": [
