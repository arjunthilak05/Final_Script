          "commercial_viability": "Would expansions be profitable?"
        }},
        "format_flexibility": {{
          "rating": "HIGHLY_FLEXIBLE|MODERATELY_FLEXIBLE|LIMITED_FLEXIBILITY|AUDIO_ONLY",
          "flexibility_score": 0-10,
          "visual_adaptation": {{
            "feasible": true/false,
            "best_format": "FILM|TV_SERIES|LIMITED_SERIES|WEB_SERIES|ANIMATION",
            "strengths": ["Why it would work visually"],
            "challenges": ["What makes visual adaptation difficult"],
