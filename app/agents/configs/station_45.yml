        "overall_score": 0.0-1.0,
        "overall_rating": "HIGHLY_ADAPTABLE|MODERATELY_ADAPTABLE|LIMITED_ADAPTABILITY|FORMAT_SPECIFIC",
        "international_potential": {{
          "rating": "EXCELLENT|GOOD|MODERATE|LIMITED",
          "appeal_score": 0-10,
          "culturally_translatable": true/false,
          "universal_themes": true/false,
          "target_markets": [
            {{
              "market": "Country/Region",
              "appeal": "HIGH|MEDIUM|LOW",
              "barriers": ["Cultural issues to address"],
              "opportunities": ["Why it would work"]
            }}
          ],
          "localization_notes": [
            {{
              "element": "What needs localization",
              "reason": "Why it needs adaptation",
              "approach": "How to localize"
            }}
          ],
          "cultural_barriers": [
            "Issues that limit international appeal"
          ],
          "universal_elements": [
            "What works everywhere"
          ]
        }},
        "expansion_potential": {{
          "rating": "EXCELLENT|GOOD|MODERATE|LIMITED",
          "expansion_score": 0-10,
          "season_2_possible": true/false,
          "season_2_hooks": [
            "Story threads left open for continuation"
          ],
          "spinoff_opportunities": [
            {{
              "title": "Potential spinoff name",
              "focus": "What/who it centers on",
              "appeal": "Why audiences would watch",
              "viability": "HIGH|MEDIUM|LOW"
            }}
          ],
          "universe_expandable": true/false,
          "expansion_directions": [
            "Prequels, sequels, parallel stories, anthology, etc."
          ],
          "world_richness": "Is there enough world to explore?",
