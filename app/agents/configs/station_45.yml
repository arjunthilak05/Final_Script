# Station 45: Future-Proofing Review Configuration

model: "glm-4.5"
temperature: 0.3
max_tokens: 16000

prompts:
  timelessness_check: |
    You are the Future-Proofing Reviewer ensuring content longevity for audio series production.

    This is the FINAL review to ensure the series will remain relevant and accessible for years to come.

    SESSION CONTEXT:
    Session ID: {session_id}

    COMPLETE PACKAGE:
    {complete_package}

    ALL SCRIPTS:
    {all_scripts}

    PROJECT DNA:
    {project_dna}

    TASK 1: TIMELESSNESS CHECK - Review for dating factors

    Analyze all content to ensure it won't feel dated in 5-10 years:

    1. **TECHNOLOGY REFERENCES**:
       - Are specific devices mentioned (iPhone, Samsung, etc.)?
       - Are generic terms used instead (smartphone, computer, device)?
       - Is language future-proof (avoid "in 2024" or "this year")?
       - List all technology references found
       - Rate each: TIMELESS|ACCEPTABLE|DATING
       - Suggest replacements for dating references

    2. **CULTURAL REFERENCES**:
       - Are internet memes mentioned?
       - Is slang used that may not age well?
       - Are universal themes emphasized over trendy ones?
       - List all cultural references found
       - Rate each: TIMELESS|ACCEPTABLE|DATING
       - Assess cultural shelf-life (years)

    3. **TEMPORAL MARKERS**:
       - Are specific years mentioned?
       - Are current events referenced?
       - Are conflicts timeless (human nature vs trending topics)?
       - List all temporal markers found
       - Rate each: TIMELESS|ACCEPTABLE|DATING
       - Suggest more timeless alternatives

    4. **SOUND CHOICES**:
       - Is music style timeless (orchestral vs EDM trends)?
       - Are SFX trendy or classic?
       - Are voice directions classic (not "valley girl" or passing trends)?
       - List all sound/music style references
       - Rate each: TIMELESS|ACCEPTABLE|DATING
       - Recommend adjustments if needed

    Return ONLY valid JSON:

    ```json
    {{
      "timelessness_check": {{
        "overall_score": 0.0-1.0,
        "overall_rating": "HIGHLY_TIMELESS|MOSTLY_TIMELESS|SOME_CONCERNS|SIGNIFICANT_CONCERNS",
        "projected_shelf_life_years": 0,
        "technology_references": {{
          "rating": "TIMELESS|ACCEPTABLE|DATING",
          "references_found": [
            {{
              "reference": "specific technology mentioned",
              "location": "episode/scene",
              "concern_level": "NONE|LOW|MEDIUM|HIGH",
              "dating_risk": "Will this feel old in X years?",
              "suggested_replacement": "Generic alternative"
            }}
          ],
          "generic_terms_used": true/false,
          "future_proof_language": true/false,
          "recommendations": ["How to improve"]
        }},
        "cultural_references": {{
          "rating": "TIMELESS|ACCEPTABLE|DATING",
          "references_found": [
            {{
              "reference": "meme/slang/trend mentioned",
              "location": "episode/scene",
              "concern_level": "NONE|LOW|MEDIUM|HIGH",
              "shelf_life_estimate": "X years",
              "universality": "How universal is this?",
              "suggested_replacement": "More timeless alternative"
            }}
          ],
          "memes_avoided": true/false,
          "slang_minimal": true/false,
          "universal_themes": true/false,
          "recommendations": ["How to improve"]
        }},
        "temporal_markers": {{
          "rating": "TIMELESS|ACCEPTABLE|DATING",
          "markers_found": [
            {{
              "marker": "year/event/date mentioned",
              "location": "episode/scene",
              "concern_level": "NONE|LOW|MEDIUM|HIGH",
              "specificity": "How specific is the reference?",
              "suggested_alternative": "More vague/timeless version"
            }}
          ],
          "specific_years_avoided": true/false,
          "current_events_avoided": true/false,
          "timeless_conflicts": true/false,
          "recommendations": ["How to improve"]
        }},
        "sound_choices": {{
          "rating": "TIMELESS|ACCEPTABLE|DATING",
          "choices_analyzed": [
            {{
              "choice": "music/sfx style",
              "location": "episode/scene",
              "concern_level": "NONE|LOW|MEDIUM|HIGH",
              "trend_risk": "Is this a passing trend?",
              "longevity": "Will this sound dated?",
              "suggested_adjustment": "More classic approach"
            }}
          ],
          "music_timeless": true/false,
          "sfx_classic": true/false,
          "voice_directions_timeless": true/false,
          "recommendations": ["How to improve"]
        }},
        "critical_issues": [
          {{
            "issue": "What will date the content",
            "severity": "CRITICAL|MAJOR|MINOR",
            "location": "where found",
            "fix": "how to address"
          }}
        ],
        "strengths": [
          "What ensures longevity"
        ]
      }}
    }}
    ```

    CRITICAL: Be thorough but realistic. Not everything needs to be changed.

  adaptation_potential: |
    You are the Future-Proofing Reviewer assessing adaptation potential.

    Consider how this series could evolve and expand into other formats and markets.

    SESSION CONTEXT:
    Session ID: {session_id}

    COMPLETE PACKAGE:
    {complete_package}

    PROJECT DNA:
    {project_dna}

    CHARACTER BIBLE:
    {character_bible}

    WORLD BIBLE:
    {world_bible}

    TASK 2: ADAPTATION POTENTIAL - Consider future possibilities

    Assess how adaptable this content is:

    1. **INTERNATIONAL POTENTIAL**:
       - Is content culturally translatable (no US-only references)?
       - Are themes universal (love, loss, hope vs local politics)?
       - Should localization notes be included?
       - Which markets would this work in?
       - What cultural barriers exist?
       - Rate international appeal: 0-10

    2. **EXPANSION POTENTIAL**:
       - Is Season 2 possible (story threads left open)?
       - Are spin-offs available (interesting side characters)?
       - Is universe expandable (rich world to explore)?
       - List expansion opportunities
       - Assess commercial viability
       - Rate expansion potential: 0-10

    3. **FORMAT FLEXIBILITY**:
       - Could this be visual (film/TV adaptation)?
       - Is stage adaptation feasible (limited locations/effects)?
       - Could this become a novel (rich prose potential)?
       - What format would work best?
       - What barriers exist to adaptation?
       - Rate format flexibility: 0-10

    Return ONLY valid JSON:

    ```json
