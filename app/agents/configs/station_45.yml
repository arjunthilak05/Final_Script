  legacy_notes: |
    You are the Future-Proofing Reviewer creating legacy documentation.

    Document the creator's vision and production insights for future reference.

    SESSION CONTEXT:
    Session ID: {session_id}

    PROJECT DNA:
    {project_dna}

    ALL PRODUCTION NOTES:
    {production_notes}

    TASK 4: LEGACY NOTES - Create future reference documentation

    Create comprehensive legacy documentation:

    1. **CREATOR'S INTENT**:
       - What was the original vision?
       - What key themes were intended?
       - What elements are most important?
       - What should never change in adaptations?
       - Document creative philosophy

    2. **PRODUCTION NOTES**:
       - What lessons were learned during production?
       - What problems were solved and how?
       - What recommendations for future productions?
       - What worked exceptionally well?
       - What would you do differently?

    3. **AUDIENCE NOTES**:
       - Who is the target audience precisely?
       - What experience goals were set?
       - How should success be measured?
       - What emotional journey is intended?
       - What should audiences take away?

